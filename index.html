<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSG Studio Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
         <div class="login-container">
          <div class="login-card">
            <div class="logo">
    <img src="./assets/Screenshot 2026-10-04 005221.png" alt="TSG Studio Logo">
</div>
            <!-- <h1 class="heading">TSG Studio</h1> -->
            <p class="para">  Welcome Back! Please login to continue</p>
               <form id="loginForm">

            <div class="input-group">
                <label for="username">Email / Username</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Enter your email"
                >
            </div>

            <div class="input-group">
    <label for="password">Password</label>

    <div class="password-wrapper">
    <input 
        type="password" 
        id="password" 
        placeholder="Enter your password"
    >

    <button type="button" id="togglePassword">
        👁️
    </button>
</div>
<a href="#" id="forgotPassword" class="forgot-password">
    Forgot password?
</a>
   
</div>
                  <div class="login-options">

    <label>
        <input type="checkbox" id="rememberMe">
        <span>Remember me</span>
    </label>

</div>
            <button type="submit">Login</button>

            <p id="message"></p>

        </form>
             
          
     <p class="signup-text">
    Don't have an account? <a href="#">Contact us</a>
</p>
<p class="signup-text">
    © 2026 TSG Studio. All rights reserved.
</p>
</div>
         </div>
  <script src="./script.js"></script>
</body>
</html>
